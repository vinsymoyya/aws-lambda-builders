name: Frozen lock export validation
on:
  push:
    branches: [validation/uv-frozen-lock-export]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / uv ${{ matrix.uv }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        uv: ['0.11.26', latest]
    env:
      LAMBDA_BUILDERS_DEV: '1'
      BLACK_NUM_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 202f389645834f577d046fb7ced2b36c4ec962b5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ matrix.uv }}
      - name: Install declared dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check aws_lambda_builders
      - name: Format
        run: python -m black --check setup.py aws_lambda_builders tests --workers 2
      - name: Unit and functional tests
        run: python -m pytest -q --cov aws_lambda_builders --cov-report term-missing --cov-fail-under 94 tests/unit tests/functional
      - name: UV integration tests
        run: python -m pytest -q tests/integration/workflows/python_uv
