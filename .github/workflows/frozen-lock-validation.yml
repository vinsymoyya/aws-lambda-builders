name: Locked export validation
on:
  push:
    branches: [validation/uv-frozen-lock-export]
permissions:
  contents: read
jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / uv ${{ matrix.uv }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        uv: ['0.11.26', latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest
            uv: latest
            python: '3.10'
    env:
      LAMBDA_BUILDERS_DEV: '1'
      BLACK_NUM_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4145c4e8e28741f7a83d4a8421e7564746dafc6c
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ matrix.uv }}
      - name: Install target runtime for offline regression
        if: matrix.python == '3.10'
        run: uv python install 3.13
      - name: Install declared dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check aws_lambda_builders
      - name: Format
        run: python -m black --check setup.py aws_lambda_builders tests --workers 2
      - name: Unit and functional tests
        run: python -m pytest -q --cov aws_lambda_builders --cov-report term-missing --cov-fail-under 94 tests/unit tests/functional
      - name: UV integration tests
        run: python -m pytest -q tests/integration/workflows/python_uv
